name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and LFS files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download LFS objects
        run: git lfs pull

      - name: Verify binary assets
        run: |
          if grep -RIl "version https://git-lfs.github.com/spec/v1" public; then
            echo "A Git LFS pointer was found in public/."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build site
        run: npm run build

      - name: Publish site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
